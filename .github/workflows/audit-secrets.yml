name: Secrets audit (full git history)

# PHASE-2 EXPERIMENT — see the planning repo's ADR-007 (why the scanning
# workflows live in this fork) and ADR-008 (why any workflow edit moves the
# pinned scanned commit; this file is baseline B5).
#
# Purpose: the one dimension no tool in the trial has ever covered. Every other
# scanner — all sixteen — reads the working tree at one commit. A secret that was
# committed and later removed is invisible to every one of them by construction,
# not by failure. This workflow scans the COMMIT HISTORY.
#
# Tool: gitleaks, chosen over trufflehog because it emits SARIF natively
# (`--report-format sarif`), which is what lets this result land in the Security
# tab and be compared against the other fifteen SARIF-producing tools under
# ADR-002. TruffleHog v3 has no SARIF printer at all — its output.Printer
# implementations are JSON, legacy JSON, GitHub Actions and plain text — so it
# would have needed a bespoke converter to be comparable. gitleaks is also MIT;
# trufflehog is AGPL-3.0, which is a legal-review item in a commercial pipeline
# and not one in a research trial, but it belongs in the record either way.
#
# THREE PASSES, and the reason for each:
#
#   1. `gitleaks git .`                     — master's full history. The headline
#      measurement. Master is the ref every other tool scanned, so this is the
#      only pass comparable to them.
#   2. `gitleaks git . --log-opts=--all`    — every ref, including the ten
#      `murdahlob/ai-review-*` branches we created for the CodeRabbit trial.
#      Kept SEPARATE and artifact-only: those branches carry our own planted
#      test strings, so folding them into the headline count would repeat the
#      ADR-007 measurement artifact where our harness pollutes the tool's score.
#   3. `gitleaks dir .`                     — the working tree at HEAD only, same
#      binary, same rules, same commit. This exists as the control: the set
#      difference (1) minus (3) IS the answer to "does history contain secrets
#      the tree does not", and (3) minus (1) is the answer to the question people
#      forget to ask — whether a history scan is a superset of a tree scan.
#
# Why the control pass is not optional. gitleaks reports a history finding
# against the commit that INTRODUCED the secret, so a secret still present at
# HEAD is reported with an old commit SHA. Filtering history findings on
# `commitSha != HEAD` therefore looks like it isolates history-only secrets and
# does not — it would classify every still-present secret as history-only. Only
# a set difference against an actual tree scan answers the question.
#
# Reports are written to RUNNER_TEMP, NOT into the checked-out tree. This is not
# tidiness. On the first smoke run they were written into the workspace, the
# `dir` control pass ran afterwards, and gitleaks found the secrets inside its
# own earlier reports: 45 of that pass's 51 findings were the scanner reading its
# own output, an 88% inflation of the control the whole comparison rests on.
# Every working-tree secret scanner that writes its report where it scans has
# this failure mode, and it inflates rather than suppresses, so it never looks
# like a bug.
#
# Nothing here installs or executes the application's dependencies, and no pass
# checks out or runs application code.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  security-events: write

concurrency:
  group: audit-secrets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Secrets - gitleaks (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      # fetch-depth: 0 is the entire point of this workflow. The default
      # checkout is a depth-1 clone with exactly one commit, against which a
      # history scanner reports zero findings and a green run — a result
      # indistinguishable from a clean history. The assertion step below exists
      # because that is the single easiest way to make this whole job
      # meaningless without anything appearing to be wrong.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the checkout is not shallow
        run: |
          shallow=$(git rev-parse --is-shallow-repository)
          commits=$(git rev-list --count HEAD)
          refs=$(git rev-list --count --all)
          echo "shallow: ${shallow}"
          echo "commits reachable from HEAD: ${commits}"
          echo "commits reachable from all refs: ${refs}"
          if [ "$shallow" != "false" ]; then
            echo "::error::the checkout is shallow - a history scan of one commit is not a history scan; set fetch-depth: 0"
            exit 1
          fi
          if [ "${commits:-0}" -lt 2 ]; then
            echo "::error::only ${commits} commit(s) reachable from HEAD - there is no history to scan"
            exit 1
          fi
          # REPORT_DIR is exported here rather than declared in the job's `env:`
          # block. `${{ runner.temp }}` there is rejected outright — the runner
          # context is not among the contexts a job-level `env` may use, and the
          # whole file fails to parse with `(Line: 81, Col: 19): Unrecognized
          # named-value: 'runner'`, which surfaces as a run with zero jobs and no
          # log. `$RUNNER_TEMP` is a plain environment variable and has no such
          # restriction.
          mkdir -p "${RUNNER_TEMP}/gitleaks-reports"
          {
            echo "REPORT_DIR=${RUNNER_TEMP}/gitleaks-reports"
            echo "GL_COMMITS=${commits}"
            echo "GL_COMMITS_ALL=${refs}"
          } >> "$GITHUB_ENV"

      # Released binary rather than the vendor action. `gitleaks/gitleaks-action`
      # is free for personal accounts and public repositories but requires a paid
      # licence key for organisation-owned repositories, so the action would make
      # this job unreproducible for exactly the readers most likely to want it.
      # The binary has no such condition. The checksum check is not decoration:
      # this step downloads and executes a third-party binary in a runner that
      # holds no secrets but does have `security-events: write`.
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$asset" "${base}/${asset}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt > expected-checksum.txt
          if [ ! -s expected-checksum.txt ]; then
            echo "::error::${asset} does not appear in the release checksums file"
            exit 1
          fi
          sha256sum -c expected-checksum.txt
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$asset" gitleaks
          gitleaks version

      # `--exit-code 0` instead of `continue-on-error: true`, deliberately.
      # gitleaks exits 1 when it finds leaks and also 1 on an actual error; the
      # house `continue-on-error` pattern would swallow both alike, which is the
      # phase-1 Nikto failure mode (a broken step reporting success). Setting the
      # leak exit code to 0 keeps a genuine crash fatal while a finding is not.
      #
      # No `--redact`: the report has to carry the secret VALUE, because the
      # history-vs-tree set difference below is computed on it. The comparison
      # step prints rule, file and commit only, never the value. The SARIF
      # snippet does carry it, exactly as Trivy's and Semgrep's already do for
      # the same repository — this is a public, deliberately vulnerable fork
      # whose secrets are fake by construction.
      - name: Pass 1 - full history of master (SARIF)
        run: |
          gitleaks git . \
            --report-format sarif \
            --report-path "$REPORT_DIR/gitleaks-history.sarif" \
            --exit-code 0 \
            --no-banner

      - name: Pass 1 - full history of master (JSON, for the set comparison)
        run: |
          gitleaks git . \
            --report-format json \
            --report-path "$REPORT_DIR/gitleaks-history.json" \
            --exit-code 0 \
            --no-banner

      - name: Pass 2 - every ref, our own branches included (JSON only)
        run: |
          gitleaks git . \
            --log-opts=--all \
            --report-format json \
            --report-path "$REPORT_DIR/gitleaks-allrefs.json" \
            --exit-code 0 \
            --no-banner

      - name: Pass 3 - control, working tree at HEAD only (SARIF + JSON)
        run: |
          gitleaks dir . \
            --report-format sarif \
            --report-path "$REPORT_DIR/gitleaks-tree.sarif" \
            --exit-code 0 \
            --no-banner
          gitleaks dir . \
            --report-format json \
            --report-path "$REPORT_DIR/gitleaks-tree.json" \
            --exit-code 0 \
            --no-banner

      # The measurement. A "secret" is keyed on (rule id, secret value) rather
      # than on file path or line, because the same credential moving between
      # files across history is one secret, not two, and gitleaks reports a
      # separate finding per commit that touches it.
      #
      # Counted twice, whole-tree and application-only, per ADR-007: findings on
      # `.github/workflows/**` are OUR files, not the application's, and they are
      # excluded from recall.
      - name: Compare history against the working tree
        run: |
          jq -n \
            --slurpfile hist "$REPORT_DIR/gitleaks-history.json" \
            --slurpfile tree "$REPORT_DIR/gitleaks-tree.json" \
            '
              def norm: sub("^\\./"; "");
              def harness: (.File | norm | startswith(".github/workflows/"));
              def skey: [.RuleID, .Secret];
              def pkey: [.RuleID, (.File | norm), .Secret];
              def describe: group_by(skey)
                            | map({
                                rule:        .[0].RuleID,
                                files:       (map(.File | norm) | unique),
                                commits:     (map(.Commit) | unique),
                                first_date:  (map(.Date) | sort | .[0]),
                                authors:     (map(.Author) | unique),
                                occurrences: length
                              });
              ($hist[0] // []) as $h
              | ($tree[0] // []) as $t
              | ($t | map(skey)) as $ts
              | ($h | map(skey)) as $hs
              | ($t | map(pkey)) as $tp
              | {
                  history_findings:            ($h | length),
                  tree_findings:               ($t | length),
                  history_distinct:            ($h | map(skey) | unique | length),
                  tree_distinct:               ($t | map(skey) | unique | length),
                  history_distinct_app_only:   ($h | map(select(harness | not)) | map(skey) | unique | length),
                  tree_distinct_app_only:      ($t | map(select(harness | not)) | map(skey) | unique | length),
                  history_only_secrets:        ($h | map(select((skey | IN($ts[])) | not)) | describe),
                  tree_only_secrets:           ($t | map(select((skey | IN($hs[])) | not)) | describe),
                  history_only_locations:      ($h | map(select((pkey | IN($tp[])) | not))
                                                   | map({ rule: .RuleID, file: (.File | norm), commit: .Commit })
                                                   | unique | length)
                }
            ' > "$REPORT_DIR/history-vs-tree.json"
          cat "$REPORT_DIR/history-vs-tree.json"

      - name: Summarise
        if: always()
        run: |
          cmp="$REPORT_DIR/history-vs-tree.json"
          {
            echo "## gitleaks - secrets in git history"
            echo ""
            echo "- version: \`$(gitleaks version 2>/dev/null || echo n/a)\`"
            echo "- scanned SHA: \`${GITHUB_SHA}\`"
            echo "- commits scanned (HEAD): **${GL_COMMITS:-?}**, all refs: **${GL_COMMITS_ALL:-?}**"
            echo "- rules loaded: **$(jq -r '.runs[0].tool.driver.rules | length' "$REPORT_DIR/gitleaks-history.sarif" 2>/dev/null || echo '?')**"
            echo ""
            echo "| pass | scope | findings |"
            echo "|---|---|---|"
            echo "| 1 | master history | $(jq -r 'length' "$REPORT_DIR/gitleaks-history.json" 2>/dev/null || echo '?') |"
            echo "| 2 | all refs (incl. our own PR branches) | $(jq -r 'length' "$REPORT_DIR/gitleaks-allrefs.json" 2>/dev/null || echo '?') |"
            echo "| 3 | working tree at HEAD (control) | $(jq -r 'length' "$REPORT_DIR/gitleaks-tree.json" 2>/dev/null || echo '?') |"
            echo ""
            echo "Distinct secrets: history **$(jq -r '.history_distinct' "$cmp" 2>/dev/null)** whole-tree / **$(jq -r '.history_distinct_app_only' "$cmp" 2>/dev/null)** application-only; tree **$(jq -r '.tree_distinct' "$cmp" 2>/dev/null)** / **$(jq -r '.tree_distinct_app_only' "$cmp" 2>/dev/null)**."
            echo ""
            echo "### Does history hold secrets the tree does not?"
            echo ""
            n=$(jq -r '.history_only_secrets | length' "$cmp" 2>/dev/null || echo '?')
            echo "**${n}** distinct secret(s) present in master's history and absent from the working tree."
            echo ""
            if [ "${n:-0}" != "0" ] && [ "${n}" != "?" ]; then
              echo "| rule | file(s) | first seen | commit(s) |"
              echo "|---|---|---|---|"
              jq -r '.history_only_secrets[] | "| \(.rule) | \(.files | join(", ")) | \(.first_date) | \(.commits | join(", ")) |"' "$cmp"
              echo ""
              echo "Secret values are deliberately not printed."
            else
              echo "Every secret gitleaks found in history is still present in the tree at"
              echo "\`${GITHUB_SHA}\`. On this target, history scanning adds no finding that a"
              echo "working-tree scan would miss. That is a result, not an absence of one."
            fi
            echo ""
            echo "### And the reverse - secrets in the tree that the history scan missed"
            echo ""
            m=$(jq -r '.tree_only_secrets | length' "$cmp" 2>/dev/null || echo '?')
            echo "**${m}** distinct secret(s) in the tree with no match in the history scan."
            if [ "${m:-0}" != "0" ] && [ "${m}" != "?" ]; then
              echo ""
              echo "| rule | file(s) |"
              echo "|---|---|"
              jq -r '.tree_only_secrets[] | "| \(.rule) | \(.files | join(", ")) |"' "$cmp"
              echo ""
              echo "A history scan is therefore NOT a superset of a tree scan - run both."
            fi
            echo ""
            echo "### Findings by rule (master history)"
            echo ""
            echo "| rule | findings | files |"
            echo "|---|---|---|"
            jq -r 'group_by(.RuleID) | map({r: .[0].RuleID, n: length, f: (map(.File) | unique | length)})
                   | sort_by(-.n) | .[] | "| \(.r) | \(.n) | \(.f) |"' "$REPORT_DIR/gitleaks-history.json" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      # Same convention as audit-static.yml's SARIF check and for the same
      # reason: a scanner that dies while still reporting success produces no
      # report, and no report reads exactly like a clean scan. Zero FINDINGS is a
      # legitimate outcome here; zero RULES never is, and a missing file never is.
      - name: Verify every expected report was produced
        if: always()
        run: |
          fail=0
          for f in gitleaks-history.sarif gitleaks-history.json gitleaks-allrefs.json \
                   gitleaks-tree.sarif gitleaks-tree.json history-vs-tree.json; do
            if [ ! -s "$REPORT_DIR/$f" ]; then
              echo "::error::${f} is missing or empty - the scan failed silently; check the step log above"
              fail=1
            fi
          done
          for f in gitleaks-history.sarif gitleaks-tree.sarif; do
            [ -s "$REPORT_DIR/$f" ] || continue
            rules=$(jq '.runs[0].tool.driver.rules | length' "$REPORT_DIR/$f" 2>/dev/null || echo 0)
            if [ "${rules:-0}" -eq 0 ]; then
              echo "::error::${f} carries zero rules - gitleaks loaded no ruleset, so its zero findings mean nothing"
              fail=1
            fi
          done
          # The control pass must find the committed RSA private key
          # (artifacts/cert/server.key, GT-15) that Trivy, Semgrep and DeepSource
          # all found in this same tree. If it does not, the tree pass is broken
          # and the set difference above it is measuring nothing.
          if [ -s "$REPORT_DIR/gitleaks-tree.json" ]; then
            n=$(jq '[.[] | select(.File | test("server\\.key$"))] | length' "$REPORT_DIR/gitleaks-tree.json" 2>/dev/null || echo 0)
            if [ "${n:-0}" -eq 0 ]; then
              echo "::error::the working-tree control pass did not find artifacts/cert/server.key, which three other tools find in this tree - the control is broken, so the history-vs-tree difference is not interpretable"
              fail=1
            fi
          fi
          exit "$fail"

      - name: Record run-manifest fragment (gitleaks)
        if: always()
        run: |
          {
            echo "## gitleaks"
            echo "version: $(gitleaks version 2>/dev/null || echo 'n/a')"
            echo "install: released binary gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, sha256 verified against the release checksums file"
            echo "passes:  git (HEAD history), git --log-opts=--all, dir (working tree)"
            echo "rules:   $(jq -r '.runs[0].tool.driver.rules | length' "$REPORT_DIR/gitleaks-history.sarif" 2>/dev/null || echo 'n/a') (default config, no .gitleaks.toml in this tree)"
            echo "commits: $(git rev-list --count HEAD 2>/dev/null || echo 'n/a') from HEAD, $(git rev-list --count --all 2>/dev/null || echo 'n/a') from all refs"
            echo "reports written to RUNNER_TEMP, outside the scanned tree"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > "$REPORT_DIR/manifest-gitleaks.txt"

      # Only now, with every scan finished, do the reports enter the workspace.
      # Doing it earlier is the self-scan bug described in the header.
      - name: Collect reports into the workspace for upload
        if: always()
        run: |
          mkdir -p gitleaks-reports
          cp "$REPORT_DIR"/* gitleaks-reports/ 2>/dev/null || true
          ls -l gitleaks-reports

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-gitleaks
          path: gitleaks-reports/manifest-gitleaks.txt
          if-no-files-found: error

      # Only the history pass goes to the Security tab. Its own category, so it
      # coexists with semgrep / codeql / osv-scanner / trivy / snyk-* rather than
      # replacing whichever uploaded last. The tree pass is a control for this
      # job's arithmetic, not a sixth opinion on the tree, and uploading it would
      # double-count the same scanner in the tab — the same call already made for
      # Trivy's second pass.
      #
      # Known presentation defect, measured not assumed: a history finding's
      # line number is correct for the commit that introduced it and GitHub
      # renders it against HEAD. At B5 the three `curl-auth-user` hits report
      # lines 101/160/180 of `sonarqube-community.yml` as it was at B3, where the
      # same strings now sit at 118/185/205. The Security tab will point at
      # unrelated lines. The commit SHA in `partialFingerprints` is the reliable
      # locator, and it is not what the UI links to.
      - name: Upload gitleaks history SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-reports/gitleaks-history.sarif
          category: gitleaks-history

      - name: Upload gitleaks reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks
          path: |
            gitleaks-reports/gitleaks-history.sarif
            gitleaks-reports/gitleaks-history.json
            gitleaks-reports/gitleaks-allrefs.json
            gitleaks-reports/gitleaks-tree.sarif
            gitleaks-reports/gitleaks-tree.json
            gitleaks-reports/history-vs-tree.json
          if-no-files-found: error
