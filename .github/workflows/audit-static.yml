name: Code Audit (static + SCA)

# PHASE-2 SCANNING WORKFLOW — see the planning repo's ADR-006 (target selection)
# and ADR-007 (why this workflow lives in the fork rather than in the evaluation
# repo).
#
# Unlike the phase-1 workflow in murdahlob/code-review-automation-test, this one
# scans THIS repository's own tree (self-checkout). That is the whole point of
# the phase-2 fork: the code under test is hosted here, so SARIF paths resolve
# and results can go to the Security tab, where GitHub's own code-scanning UI
# becomes part of what is being evaluated.
#
# Tools: Semgrep (twice — CE via the registry packs, and the hosted Free Edition
# via `semgrep ci`, so the cross-file engine can be compared against the CE
# baseline over the same tree), OSV-Scanner, Trivy (vuln + secret + misconfig, run twice —
# once with defaults and once with dev dependencies included), Snyk Code, Snyk
# Open Source, and `npm audit` as the zero-setup baseline (the npm analogue of
# phase 1's `pnpm audit` — a reference point, not a ranked tool). CodeQL runs in
# codeql.yml; SonarQube Community runs in sonarqube-community.yml.
#
# SARIF is published TWICE on purpose: to Security -> Code scanning (so the
# native experience is evaluated) and as run artifacts (so the raw files can be
# diffed offline with jq, per ADR-002).
#
# This workflow never installs or executes the application's dependencies.
# `npm audit` reads package-lock.json only. Nothing here boots the app; DAST is
# audit-dast.yml.

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  security-events: write

concurrency:
  group: audit-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- SAST
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Semgrep runs as a `docker run` step rather than as a `container:` job:
      # the semgrep/semgrep image is Alpine/musl and ships no glibc loader, so
      # the glibc-linked Node that Actions injects into container jobs (to run
      # JavaScript actions such as checkout / upload-sarif) cannot be relied on
      # inside it. Keeping the scanner in a plain step leaves those actions on
      # the host runner.
      #
      # Rule packs: the generic security packs plus the packs matching this
      # stack (Node.js / Express / server-side JavaScript, swig templates).
      # `p/typescript` and `p/react` from the phase-1 workflow are dropped —
      # NodeGoat has neither.
      - name: Semgrep scan
        continue-on-error: true
        run: |
          docker run --rm --user 0 \
            -v "${PWD}:/src" -w /src \
            semgrep/semgrep \
            semgrep scan \
              --config p/default \
              --config p/security-audit \
              --config p/secrets \
              --config p/owasp-top-ten \
              --config p/javascript \
              --config p/nodejs \
              --metrics off \
              --sarif --output /src/semgrep.sarif

      - name: Record run-manifest fragment (Semgrep)
        if: always()
        run: |
          {
            echo "## semgrep"
            echo "image:   $(docker image inspect --format '{{index .RepoDigests 0}}' semgrep/semgrep 2>/dev/null || echo 'not pulled')"
            echo "version: $(docker run --rm semgrep/semgrep semgrep --version 2>/dev/null || echo 'n/a')"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-semgrep.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-semgrep
          path: manifest-semgrep.txt
          if-no-files-found: warn

      - name: Upload Semgrep SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: warn

  # ------------------------------------------ Semgrep hosted Free Edition
  # EXPERIMENT — the planning repo's phase-2 selection doc, section 7 item 4.
  #
  # The `semgrep` job above runs Semgrep CE, of which the vendor says it "can
  # only analyze interactions within a single function". Every CE figure in this
  # trial is therefore an intraprocedural floor, and the four ground-truth rows
  # nothing free has found (NoSQL injection, log injection, session fixation,
  # SSRF) all need untrusted input tracked ACROSS functions and files. The
  # hosted Free Edition (up to 10 contributors) is documented to include that
  # cross-file analysis at no cost, which — with CodeQL licence-barred from
  # private client code — makes it the only known free route to the capability.
  # Reaching it needs a login: `semgrep ci` with SEMGREP_APP_TOKEN, plus the
  # cross-file toggle enabled in the semgrep.dev organisation settings.
  #
  # This is a SEPARATE job on purpose. The CE job above is the trial's baseline
  # and its configuration must stay untouched, so both tiers scan the same tree
  # in the same run and the engine is the variable under test.
  #
  # Two differences are accepted and must be REPORTED rather than hidden:
  #   1. `semgrep ci` takes its rules from the organisation's policy on
  #      semgrep.dev, not from the six `--config p/...` packs the CE job pins.
  #      The rule set is therefore a second moving variable, and any delta is
  #      "hosted tier as configured" rather than "engine alone".
  #   2. Unlike every other job here, this one talks to a vendor backend:
  #      findings and repository metadata leave, source does not.
  #
  # It runs on the host runner, not as `docker run` like the CE job: `semgrep
  # ci` shells out to git for repository metadata and reads the GITHUB_*
  # environment to identify the project. Both work natively on the runner, while
  # inside the container the bind-mounted workspace is owned by the runner user
  # and root's git trips its dubious-ownership check.
  semgrep-pro:
    name: SAST - Semgrep hosted (cross-file)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      # Full history: `semgrep ci` inspects git to decide whether a scan is full
      # or diff-aware and to label the scan on semgrep.dev. A depth-1 checkout
      # makes it guess.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep --version

      - name: Semgrep hosted scan
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          # `semgrep ci` exits 1 when it has findings and 2 on error, so the exit
          # code is captured rather than allowed to abort the step: a scan with
          # findings must still upload its SARIF, and "errored" has to stay
          # distinguishable from "found nothing". The console output is teed to a
          # file because it is the only place the engine tier is stated, and
          # proving which engine ran is the point of the experiment.
          #
          # `--verbose` is on for that last reason alone. Neither the SARIF nor
          # the default console output states whether INTERFILE (cross-file)
          # analysis was active — the default banner reports only that the Pro
          # binary was installed, which is also true when the organisation has
          # cross-file switched off. Verbose output names the analysis mode, and
          # an experiment whose entire question is "did cross-file run" cannot
          # rely on an inference. It does not change which findings are reported.
          set +e
          semgrep ci --verbose --sarif --output semgrep-pro.sarif 2>&1 | tee semgrep-pro-log.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "semgrep ci exit code: $rc" | tee -a semgrep-pro-log.txt

      # CONTROL PASS — the only reliable way to establish the analysis mode.
      #
      # Neither the SARIF nor the console output, even at --verbose, ever names
      # the mode: the banner reports that the Pro binary was installed, which is
      # equally true when the organisation has cross-file analysis switched off.
      # So the mode is established behaviourally instead. `--pro` forces
      # interfile analysis on regardless of the organisation setting; if this
      # pass returns the same findings as the default pass above, the setting
      # was already in effect, and if it returns more, it was not. A tier
      # comparison that cannot say which tier ran measures nothing, which is why
      # this pass is worth its runtime.
      #
      # A refusal is also an answer — if `--pro` is gated behind a paid plan the
      # CLI says so, and that output is captured rather than swallowed.
      - name: Semgrep hosted scan - forced cross-file control
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set +e
          semgrep ci --pro --sarif --output semgrep-pro-forced.sarif 2>&1 \
            | tee semgrep-pro-forced-log.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "semgrep ci --pro exit code: $rc" | tee -a semgrep-pro-forced-log.txt

      - name: Compare the default pass against the forced cross-file pass
        if: always()
        run: |
          {
            echo "## Default pass vs forced cross-file pass"
            echo ""
            for f in semgrep-pro.sarif semgrep-pro-forced.sarif; do
              if [ -s "$f" ]; then
                n=$(jq '[.runs[].results[]?] | length' "$f" 2>/dev/null || echo "?")
                a=$(jq '[.runs[].results[] | select((.locations[0].physicalLocation.artifactLocation.uri | startswith(".github/")) | not)] | length' "$f" 2>/dev/null || echo "?")
                x=$(jq '[.runs[].results[]? | select((.codeFlows // []) | length > 0)
                         | [.codeFlows[].threadFlows[].locations[].location.physicalLocation.artifactLocation.uri]
                         | unique | length] | map(select(. > 1)) | length' "$f" 2>/dev/null || echo "?")
                echo "- \`$f\`: **$n** whole-tree / **$a** application-only / **$x** findings with a dataflow trace spanning more than one file"
              else
                echo "- \`$f\`: **not produced** - see its log in the artifact"
              fi
            done
            echo ""
            if [ -s semgrep-pro.sarif ] && [ -s semgrep-pro-forced.sarif ]; then
              jq -S '[.runs[].results[] | {r: .ruleId, u: .locations[0].physicalLocation.artifactLocation.uri, l: .locations[0].physicalLocation.region.startLine}] | sort' \
                 semgrep-pro.sarif > /tmp/a.json
              jq -S '[.runs[].results[] | {r: .ruleId, u: .locations[0].physicalLocation.artifactLocation.uri, l: .locations[0].physicalLocation.region.startLine}] | sort' \
                 semgrep-pro-forced.sarif > /tmp/b.json
              if diff -q /tmp/a.json /tmp/b.json >/dev/null; then
                echo "**Finding sets are identical** - forcing cross-file analysis changed nothing, so the organisation setting was already in effect."
              else
                echo "**Finding sets differ** - the default pass was NOT running with cross-file analysis. Diff:"
                echo '```'
                diff /tmp/a.json /tmp/b.json | head -60
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The scan step cannot fail, so without this the job would report success
      # whether Semgrep scanned the tree, refused the token, or never ran at all.
      # Same discipline as the Snyk IaC job: absence of findings and absence of a
      # scan must not look alike.
      - name: Verify the scan produced SARIF
        if: always()
        run: |
          if [ ! -s semgrep-pro-log.txt ]; then
            echo "::error::semgrep ci produced no console output at all - the step failed silently; check its log"
            exit 1
          fi
          if [ ! -s semgrep-pro.sarif ]; then
            echo "::error::semgrep-pro.sarif is missing or empty - semgrep ci did not complete a scan; the console output is in the semgrep-pro artifact"
            exit 1
          fi
          rules=$(jq '.runs[0].tool.driver.rules | length' semgrep-pro.sarif 2>/dev/null || echo 0)
          if [ "${rules:-0}" -eq 0 ]; then
            echo "::error::semgrep-pro.sarif carries zero rules - the hosted policy resolved to an empty rule set"
            exit 1
          fi

      # Which engine actually ran is the entire experiment, and it is not visible
      # in the finding count: an intrafile scan and a cross-file scan both return
      # a plausible-looking SARIF. The evidence is in the console banner and in
      # whether any dataflow trace crosses a file boundary, so both are extracted
      # here and put in the job summary. This step never fails the job - a
      # negative answer is a result.
      - name: Report the engine tier
        if: always()
        run: |
          {
            echo "## Semgrep hosted tier - engine evidence"
            echo ""
            echo "### Console lines mentioning the engine"
            echo '```'
            grep -i -E 'pro engine|interfile|cross-file|cross file|interprocedural|cross-function|deep|analysis *:|engine' \
              semgrep-pro-log.txt | head -40 || echo "(no engine-related line found)"
            echo '```'
            echo ""
            if [ -s semgrep-pro.sarif ]; then
              n=$(jq '[.runs[].results[]?] | length' semgrep-pro.sarif 2>/dev/null || echo "parse error")
              r=$(jq '.runs[0].tool.driver.rules | length' semgrep-pro.sarif 2>/dev/null || echo "parse error")
              d=$(jq -r '.runs[0].tool.driver.name + " " + (.runs[0].tool.driver.semanticVersion // "?")' semgrep-pro.sarif 2>/dev/null || echo "parse error")
              echo "SARIF: **$n results / $r rules**, driver \`$d\`"
              echo ""
              # A dataflow trace whose locations span more than one file is direct
              # proof of interfile analysis, independent of anything the banner says.
              x=$(jq '[.runs[].results[]? | select((.codeFlows // []) | length > 0)
                       | [.codeFlows[].threadFlows[].locations[].location.physicalLocation.artifactLocation.uri]
                       | unique | length] | map(select(. > 1)) | length' \
                    semgrep-pro.sarif 2>/dev/null || echo "parse error")
              echo "Findings whose dataflow trace spans more than one file: **$x**"
            else
              echo "**No SARIF produced.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record run-manifest fragment (Semgrep hosted)
        if: always()
        run: |
          {
            echo "## semgrep hosted (cross-file)"
            echo "version: $(semgrep --version 2>/dev/null || echo 'n/a')"
            echo "invocation: semgrep ci (rules from the semgrep.dev org policy, not from --config)"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-semgrep-pro.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-semgrep-pro
          path: manifest-semgrep-pro.txt
          if-no-files-found: warn

      # Distinct category so this does not overwrite the CE job's results; the
      # two tiers must sit side by side in the Security tab.
      - name: Upload Semgrep hosted SARIF to Security tab
        if: always() && hashFiles('semgrep-pro.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-pro.sarif
          category: semgrep-pro

      - name: Upload Semgrep hosted output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep-pro
          path: |
            semgrep-pro.sarif
            semgrep-pro-log.txt
            semgrep-pro-forced.sarif
            semgrep-pro-forced-log.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------- SCA
  osv-scanner:
    name: SCA - OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact release: the action has no floating `v1`/`v2` ref,
      # and its input was renamed `args` -> `scan-args` in v2. One arg per line.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true          # findings must not fail the trial run
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv.sarif
            ./

      - name: Record run-manifest fragment (OSV-Scanner)
        if: always()
        run: |
          {
            echo "## osv-scanner"
            echo "action: google/osv-scanner-action/osv-scanner-action@v2.3.8 (bundles osv-scanner of the same release)"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-osv.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-osv
          path: manifest-osv.txt
          if-no-files-found: warn

      - name: Upload OSV SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      - name: Upload OSV SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-osv-scanner
          path: osv.sarif
          if-no-files-found: warn

  trivy:
    name: SCA + secrets + misconfig - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Unlike the phase-1 target, this tree DOES carry a Dockerfile and a
      # docker-compose.yml, so Trivy's `misconfig` scanner finally has
      # something to analyse — one of the gaps phase 1 recorded.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif

      # Second pass, same commit and same action, one flag different. Trivy's
      # package-lock.json analyzer excludes dev dependencies by default, which is
      # the leading untested explanation for it reporting 71 advisories where
      # OSV-Scanner reports 171 and Snyk (with --dev) reports 192.
      #
      # Both passes are kept on purpose. Replacing the default pass would settle
      # the question and destroy the comparison at the same time: `trivy.sarif`
      # keeps meaning exactly what it meant at B1 and B2, so its numbers stay
      # comparable across baselines, while `trivy-devdeps.sarif` isolates the
      # flag as the only variable.
      #
      # The action exposes no `--include-dev-deps` input; Trivy reads every flag
      # from a matching TRIVY_<FLAG> environment variable, which is the supported
      # route. Artifact only, no Security-tab upload: two categories of the same
      # scanner over the same tree would double-count the tab.
      - name: Trivy filesystem scan (--include-dev-deps)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-devdeps.sarif

      - name: Record run-manifest fragment (Trivy)
        if: always()
        run: |
          {
            echo "## trivy"
            echo "action: aquasecurity/trivy-action@v0.36.0"
            trivy --version 2>/dev/null || echo "version: n/a (trivy binary not on PATH)"
            echo "passes:  trivy.sarif (defaults) and trivy-devdeps.sarif (TRIVY_INCLUDE_DEV_DEPS=true)"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-trivy.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-trivy
          path: manifest-trivy.txt
          if-no-files-found: warn

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Upload Trivy SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy
          path: trivy.sarif
          if-no-files-found: warn

      - name: Upload Trivy dev-deps SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy-devdeps
          path: trivy-devdeps.sarif
          if-no-files-found: warn

  # -------------------------------------------------- zero-setup SCA baseline
  # `npm audit` is the npm analogue of phase 1's `pnpm audit`: a reference point
  # for "what do you get with no tool at all", NOT a ranked tool in the trial.
  # It reads package-lock.json; dependencies are deliberately NOT installed, so
  # no lifecycle script from this 2016-era tree ever executes in the runner.
  npm-audit:
    name: SCA baseline - npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (JSON)
        continue-on-error: true          # non-zero exit just means "vulns found"
        run: |
          npm audit --package-lock-only --json > npm-audit.json || true
          npm audit --package-lock-only > npm-audit.txt 2>&1 || true
          ls -l npm-audit.json npm-audit.txt || true

      - name: Summarise npm audit
        if: always()
        run: |
          {
            echo "## npm audit (zero-setup baseline)"
            echo ""
            if [ -s npm-audit.json ]; then
              node -e '
                const a = require("./npm-audit.json");
                const m = (a.metadata && a.metadata.vulnerabilities) || {};
                console.log("| severity | count |");
                console.log("|---|---|");
                for (const k of ["critical","high","moderate","low","info","total"]) {
                  if (k in m) console.log(`| ${k} | ${m[k]} |`);
                }
                const adv = a.vulnerabilities ? Object.keys(a.vulnerabilities).length : 0;
                console.log("");
                console.log(`Advisory-carrying packages: ${adv}`);
              ' || echo "could not parse npm-audit.json"
            else
              echo "**npm audit produced no JSON** - check the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record run-manifest fragment (npm audit)
        if: always()
        run: |
          {
            echo "## npm audit"
            echo "npm:  $(npm --version 2>/dev/null || echo 'n/a')"
            echo "node: $(node --version 2>/dev/null || echo 'n/a')"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-npm-audit.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-npm-audit
          path: manifest-npm-audit.txt
          if-no-files-found: warn

      - name: Upload npm audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: |
            npm-audit.json
            npm-audit.txt
          if-no-files-found: warn

  # ----------------------------------------------- Snyk (needs SNYK_TOKEN)
  # Enabled 2026-07-30 once the SNYK_TOKEN repository secret existed. Two
  # separate Snyk products run as two jobs, because they are two different tools
  # in the trial: Snyk Code is SAST, Snyk Open Source is SCA.
  #
  # Safe to enable HERE in a way it was not safe in phase 1: these jobs check out
  # code we own and host, and they never install or run the dependency tree, so
  # the secret does not share a job with the execution of third-party code.
  #
  # `snyk ... --sarif-file-output=` writes the SARIF *and* exits non-zero when it
  # finds issues, hence continue-on-error on the scan steps.
  snyk-code:
    name: SAST - Snyk Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/setup@master

      - name: Snyk Code test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Record run-manifest fragment (Snyk Code)
        if: always()
        run: |
          {
            echo "## snyk code"
            echo "cli version: $(snyk --version 2>/dev/null || echo 'n/a')"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-snyk-code.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-snyk-code
          path: manifest-snyk-code.txt
          if-no-files-found: warn

      - name: Upload Snyk Code SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk Code SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-snyk-code
          path: snyk-code.sarif
          if-no-files-found: warn

  # Snyk Open Source = SCA, the fifth reading of this dependency tree alongside
  # Dependabot / OSV-Scanner / Trivy / npm audit, which disagree by a wide margin.
  # `--all-projects` finds every manifest; `--dev` includes dev dependencies,
  # because whether dev deps are counted is the leading hypothesis for that
  # disagreement and this job is where it gets tested.
  snyk-oss:
    name: SCA - Snyk Open Source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/setup@master

      - name: Snyk Open Source test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test \
            --all-projects \
            --dev \
            --sarif-file-output=snyk-oss.sarif

      - name: Record run-manifest fragment (Snyk Open Source)
        if: always()
        run: |
          {
            echo "## snyk open source"
            echo "cli version: $(snyk --version 2>/dev/null || echo 'n/a')"
            echo "flags: --all-projects --dev"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-snyk-oss.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-snyk-oss
          path: manifest-snyk-oss.txt
          if-no-files-found: warn

      - name: Upload Snyk Open Source SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - name: Upload Snyk Open Source SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-snyk-oss
          path: snyk-oss.sarif
          if-no-files-found: warn

  # Snyk IaC = infrastructure-as-code misconfiguration, the third product on the
  # same SNYK_TOKEN. It exists in this trial as a SECOND OPINION on exactly one
  # number: Trivy's `misconfig` scanner found a single issue (`DS-0026` on
  # `Dockerfile`) across the two container files this repository carries, and one
  # finding from one tool is not enough to say whether that is a clean tree or a
  # thin scanner.
  #
  # Two passes on purpose. The first names `Dockerfile` and `docker-compose.yml`
  # explicitly, because those are the files under comparison. The second scans
  # the whole tree, so "found nothing" can be distinguished from "was never
  # pointed at anything it understands" — Snyk IaC's supported formats are
  # Terraform, CloudFormation, Kubernetes, ARM and Helm, and whether it reads
  # container files at all is precisely what this job is here to establish.
  # Both raw outputs are uploaded verbatim; a tool that refuses the input is a
  # reportable result, not a failure to hide.
  snyk-iac:
    name: IaC - Snyk IaC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: snyk/actions/setup@master

      - name: Snyk IaC test (Dockerfile + docker-compose.yml)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # `snyk iac test` exits non-zero both when it finds issues AND when it
          # rejects the input, so the exit code is captured rather than allowed
          # to abort the step — the distinction between those two cases is the
          # measurement.
          set +e
          snyk iac test Dockerfile docker-compose.yml \
            --sarif-file-output=snyk-iac.sarif > snyk-iac-files.txt 2>&1
          rc=$?
          set -e
          echo "exit code: $rc" >> snyk-iac-files.txt
          cat snyk-iac-files.txt

      - name: Snyk IaC test (whole tree)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set +e
          snyk iac test . \
            --sarif-file-output=snyk-iac-tree.sarif > snyk-iac-tree.txt 2>&1
          rc=$?
          set -e
          echo "exit code: $rc" >> snyk-iac-tree.txt
          cat snyk-iac-tree.txt

      - name: Summarise Snyk IaC
        if: always()
        run: |
          {
            echo "## Snyk IaC"
            echo ""
            for pass in files tree; do
              sarif="snyk-iac.sarif"
              [ "$pass" = "tree" ] && sarif="snyk-iac-tree.sarif"
              echo "### pass: $pass"
              if [ -s "$sarif" ]; then
                n=$(jq '[.runs[].results[]?] | length' "$sarif" 2>/dev/null || echo "parse error")
                r=$(jq '.runs[0].tool.driver.rules | length' "$sarif" 2>/dev/null || echo "parse error")
                echo "SARIF produced: **$n results / $r rules**"
              else
                echo "**no SARIF produced** - CLI output below is the result"
              fi
              echo ""
              echo '```'
              tail -40 "snyk-iac-$pass.txt" 2>/dev/null || echo "(no output captured)"
              echo '```'
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record run-manifest fragment (Snyk IaC)
        if: always()
        run: |
          {
            echo "## snyk iac"
            echo "cli version: $(snyk --version 2>/dev/null || echo 'n/a')"
            echo "passes: 'Dockerfile docker-compose.yml' and whole tree ('.')"
            echo "scanned HEAD: $(git rev-parse HEAD 2>/dev/null || echo 'n/a')"
          } > manifest-snyk-iac.txt

      - name: Upload run-manifest fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-snyk-iac
          path: manifest-snyk-iac.txt
          if-no-files-found: warn

      # Distinct `category:` is what lets tools coexist in the Security tab —
      # without it each upload replaces the previous tool's results. Guarded on
      # the file existing, because `upload-sarif` hard-fails on a missing file
      # and the whole point of this job is that producing no SARIF is a possible
      # (and reportable) outcome. The `Verify` step below is what makes that
      # outcome visible instead of silent.
      - name: Upload Snyk IaC SARIF to Security tab
        if: always() && hashFiles('snyk-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      - name: Upload Snyk IaC output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-snyk-iac
          path: |
            snyk-iac.sarif
            snyk-iac-tree.sarif
            snyk-iac-files.txt
            snyk-iac-tree.txt
          if-no-files-found: warn

      - name: Verify Snyk IaC produced something readable
        if: always()
        run: |
          if [ ! -s snyk-iac-files.txt ] && [ ! -s snyk-iac-tree.txt ]; then
            echo "::error::Snyk IaC produced neither SARIF nor CLI output - the step failed silently; check its log"
            exit 1
          fi
          if [ ! -s snyk-iac.sarif ] && [ ! -s snyk-iac-tree.sarif ]; then
            echo "::warning::Snyk IaC produced no SARIF in either pass - see snyk-iac-files.txt / snyk-iac-tree.txt for the reason it gave"
          fi

  # ------------------------------------------------------------- aggregation
  summary:
    name: Findings summary
    runs-on: ubuntu-latest
    needs: [ semgrep, semgrep-pro, osv-scanner, trivy, npm-audit, snyk-code, snyk-oss, snyk-iac ]
    if: always()
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true

      - name: Count findings per SARIF file
        run: |
          {
            echo "## Static audit summary"
            echo ""
            echo "Scanned repo: \`${GITHUB_REPOSITORY}\`"
            echo "Scanned SHA:  \`${GITHUB_SHA}\`"
            echo ""
            echo "| SARIF file | results |"
            echo "|---|---|"
            shopt -s nullglob
            for f in sarif/*.sarif; do
              n=$(jq '[.runs[].results[]?] | length' "$f" 2>/dev/null || echo "parse error")
              echo "| $(basename "$f") | ${n} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Every scan step is `continue-on-error`, so a scanner can die while its
      # step still reports success — and a missing SARIF simply produces no row
      # in the table above, masquerading as a clean scan. Each expected SARIF
      # must exist, be non-empty, and carry at least one rule (a scanner that
      # loaded zero rules is another silent failure). Any miss fails this job.
      - name: Verify each expected SARIF was produced
        run: |
          fail=0
          check() {   # $1 = expected SARIF file
            f="sarif/$1"
            if [ ! -s "$f" ]; then
              echo "::error::$1 is missing or empty - its scanner failed silently; check that job's log"
              fail=1
              return
            fi
            rules=$(jq '.runs[0].tool.driver.rules | length' "$f" 2>/dev/null || echo 0)
            if [ "${rules:-0}" -eq 0 ]; then
              echo "::error::$1 has no rules in .runs[0].tool.driver.rules - the scanner loaded zero rules; check that job's log"
              fail=1
            fi
          }
          check semgrep.sarif
          check semgrep-pro.sarif
          check osv.sarif
          check trivy.sarif
          check trivy-devdeps.sarif
          check snyk-code.sarif
          check snyk-oss.sarif
          exit "$fail"

      # `npm audit` writes JSON, not SARIF, so the check above cannot see it, and
      # its upload is `if-no-files-found: warn` — a silent failure would produce a
      # yellow annotation on an otherwise green run. That is precisely the shape
      # of the phase-1 Nikto defect: a broken step reporting success while
      # producing no report. Assert the file explicitly instead.
      - name: Download npm audit output
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: npm-audit
          path: npm-audit

      - name: Verify npm audit produced a parseable report
        if: always()
        run: |
          f=npm-audit/npm-audit.json
          if [ ! -s "$f" ]; then
            echo "::error::npm-audit.json is missing or empty - the npm audit job failed silently; check that job's log"
            exit 1
          fi
          if ! jq -e '.metadata.vulnerabilities' "$f" >/dev/null 2>&1; then
            echo "::error::npm-audit.json carries no .metadata.vulnerabilities - npm audit produced no usable report"
            exit 1
          fi

      # ----------------------------------------------- run manifest assembly
      - name: Download run-manifest fragments
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifest
          merge-multiple: true

      - name: Assemble run manifest
        if: always()
        run: |
          {
            echo "# Static audit run manifest"
            echo "workflow run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT:-1})"
            echo "date (UTC):   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository:   ${GITHUB_REPOSITORY}"
            echo "scanned SHA:  ${GITHUB_SHA}"
            echo ""
            cat manifest/*.txt 2>/dev/null || echo "no per-job fragments recovered"
          } > run-manifest.txt
          cat run-manifest.txt

      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest
          path: run-manifest.txt
          if-no-files-found: warn

      - name: Re-upload combined SARIF bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-all
          path: sarif/
          if-no-files-found: warn
